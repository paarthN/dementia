appId: app.companion.desktop
productName: Companion
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!vitest.config.ts'
  - '!**/*.test.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!staged/**'
extraResources:
  - from: staged/helper
    to: helper
  - from: staged/agent-browser
    to: agent-browser
asarUnpack:
  - resources/**
  - node_modules/playwright/**/*
  - node_modules/playwright-core/**/*
win:
  executableName: Companion
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: entitlements/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Companion uses the microphone when you click Listen.
    NSScreenCaptureUsageDescription: Companion looks at your screen when you allow it, so it can explain what is on screen.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Companion
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
